<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My First Backend Website</title>

    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000015;
        }

        h2 {
            text-align: center;
            color: #2563eb;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }
    </style>

</head>

<body>

    <div class="container">

        <h2>User Registration</h2>

        <form id="userForm">

            <label for="name">Your Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <button type="submit" id="submitBtn">
                Submit
            </button>

        </form>

        <p id="message"></p>

    </div>


    <script>

        // STEP 1: Supabase Connection

        const SUPABASE_URL =
            "https://gwuxsjdhkxelonjdhtsm.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_mBmjQIoCG9H8cuqRe5v5cA_oOqKUsHX";

        const client = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


        // STEP 2: Get HTML Elements

        const form = document.getElementById("userForm");

        const message = document.getElementById("message");

        const button = document.getElementById("submitBtn");


        // STEP 3: Submit Form

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            const name = document.getElementById("name")
                .value.trim();

            const email = document.getElementById("email")
                .value.trim();

            if (!name || !email) {
                message.textContent = "Please fill all fields.";
                message.style.color = "red";
                return;
            }

            button.disabled = true;

            message.textContent = "Saving your details...";

            try {

                // STEP 4: Insert Data into Supabase

                const { error } = await client
                    .from("users")
                    .insert([
                        {
                            name: name,
                            email: email
                        }
                    ])

                // STEP 5: Check Result

                if (error) {
                    throw error;
                }

                message.textContent =
                    "Details saved successfully!";

                message.style.color = "green";

                form.reset();

            }

            catch (error) {

                console.error("Supabase Error:", error);

                message.textContent =
                    "Error: " + error.message;

                message.style.color = "red";

            }

            finally {

                button.disabled = false;

            }

        });

    </script>

</body>

</html>
