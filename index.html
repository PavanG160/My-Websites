<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Checkout Terminal</title>
    <style>
        /* Reset and Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.7)), url('https://googleusercontent.com/image_generation_content/0');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #00ffff;
            padding: 20px;
        }

        /* Terminal Container */
        .terminal-container {
            background: rgba(10, 15, 28, 0.85);
            border: 2px solid #00ffff;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.3), inset 0 0 15px rgba(0, 255, 255, 0.1);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            backdrop-filter: blur(8px);
        }

        h2 {
            text-align: center;
            color: #ff007f;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            font-size: 24px;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }

        /* Notice Box for the Discount explanation */
        .discount-notice {
            background: rgba(255, 0, 127, 0.1);
            border: 1px dashed #ff007f;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.4;
            color: #fff;
            text-align: center;
        }

        .discount-notice span {
            color: #ff007f;
            font-weight: bold;
        }

        /* Form Layout */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #00ffff;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #00ffff;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            font-family: 'Courier New', Courier, monospace;
            transition: all 0.3s ease;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #ff007f;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }

        /* Dynamic Product Fields Container */
        #dynamicProductFields {
            margin-bottom: 20px;
        }

        .product-input-wrapper {
            margin-bottom: 12px;
        }

        /* Neon Button */
        button {
            width: 100%;
            padding: 14px;
            background: transparent;
            border: 2px solid #ff007f;
            color: #ff007f;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            background: #ff007f;
            color: #000;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
        }

        /* Output Terminal Box */
        .output-box {
            margin-top: 25px;
            padding: 15px;
            background: rgba(5, 5, 10, 0.9);
            border-left: 4px solid #00ffff;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-line;
            display: none; 
        }

        .success-text {
            color: #39ff14;
            text-shadow: 0 0 5px rgba(57, 255, 20, 0.5);
        }
    </style>
</head>
<body>

    <div class="terminal-container">
        <h2>System Checkout</h2>

        <div class="discount-notice">
            ⚡ <span>PROMO SYSTEM ACTIVE:</span> Receive an instant <span>25% discount</span> on your entire purchase total by using an authorized nexus credit card at checkout. ⚡
        </div>

        <div class="form-group">
            <label for="productCount">How many products did you buy?</label>
            <input type="number" id="productCount" min="1" placeholder="e.g., 3" oninput="generatePriceInputs()">
        </div>

        <div id="dynamicProductFields"></div>

        <div class="form-group">
            <label for="ccNum">Enter your credit card number :</label>
            <input type="number" id="ccNum" placeholder="•••••">
        </div>

        <button onclick="runCheckout()">Execute Code</button>

        <div class="output-box" id="terminalConsole"></div>
    </div>

    <script>
        // Dynamically creates text fields depending on the number of items purchased
        function generatePriceInputs() {
            let count = parseInt(document.getElementById('productCount').value);
            let container = document.getElementById('dynamicProductFields');
            
            // Clear out old boxes
            container.innerHTML = "";

            if (isNaN(count) || count < 1) return;

            // Generate an entry box for each product
            for (let i = 1; i <= count; i++) {
                let wrapper = document.createElement('div');
                wrapper.className = "product-input-wrapper";

                let label = document.createElement('label');
                label.innerText = `Enter the product ${i} price :`;

                let input = document.createElement('input');
                input.type = "number";
                input.className = "product-price-input";
                input.placeholder = "0.00";

                wrapper.appendChild(label);
                wrapper.appendChild(input);
                container.appendChild(wrapper);
            }
        }

        function runCheckout() {
            let consoleEl = document.getElementById('terminalConsole');
            let k = parseInt(document.getElementById('ccNum').value);
            
            // Collect all prices from the dynamically generated inputs
            let priceInputs = document.querySelectorAll('.product-price-input');
            let mrp = 0;

            if (priceInputs.length === 0) {
                consoleEl.innerHTML = "SYSTEM ERROR: Please specify the number of products first.";
                consoleEl.style.display = "block";
                consoleEl.style.borderLeftColor = "#ff007f";
                return;
            }

            // Loop through inputs and calculate the sum total (mrp)
            for (let i = 0; i < priceInputs.length; i++) {
                let val = parseInt(priceInputs[i].value);
                if (isNaN(val) || val < 0) {
                    consoleEl.innerHTML = `SYSTEM ERROR: Invalid price detected in Product field #${i + 1}.`;
                    consoleEl.style.display = "block";
                    consoleEl.style.borderLeftColor = "#ff007f";
                    return;
                }
                mrp += val;
            }
            
            // Compile terminal log strings
            let output = `Total price is : ${mrp}\n\n Instan 25% discout on the credit card\n\n`;

            // Python Logic: if k == 12345:
            if (k === 12345) {
                let div = 25.0 / 100;
                let pro = div * mrp;
                let fin = mrp - pro;

                output += `<span class="success-text">successfully entered</span>\n`;
                output += `${div}\n`;
                output += `The final price after discount is <span class="success-text">${fin}</span>`;
                consoleEl.style.borderLeftColor = "#39ff14"; 
            } else {
                output += `ACCESS DENIED: Invalid card number.\nNo discount applied.\nFinal Price remains: ${mrp}`;
                consoleEl.style.borderLeftColor = "#ff007f"; 
            }

            // Show updated results in terminal box
            consoleEl.innerHTML = output;
            consoleEl.style.display = "block";
        }
    </script>

</body>
</html>
